name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify CLI
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp clean verify 2>&1 | tee "$RUNNER_TEMP/pocketgit-build.log"
      - name: Report Maven and test failures
        if: failure()
        run: python scripts/report-ci-failures.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pocketgit-${{ matrix.os }}
          path: |
            target/pocketgit*.jar
            target/*.sha256
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/spotbugsXml.xml
            ${{ runner.temp }}/pocketgit-build.log
  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify GUI
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -Pgui clean verify 2>&1 | tee "$RUNNER_TEMP/pocketgit-build.log"
      - name: Report Maven and test failures
        if: failure()
        run: python scripts/report-ci-failures.py
      - name: Exercise the JavaFX scene
        shell: bash
        run: |
          mkdir -p target/gui-smoke
          monocle="$GITHUB_WORKSPACE/target/gui-smoke/openjfx-monocle-21.0.2.jar"
          curl -fsSL https://maven-central.storage-download.googleapis.com/maven2/org/testfx/openjfx-monocle/21.0.2/openjfx-monocle-21.0.2.jar -o "$monocle"
          printf '%s  %s\n' 3d0b0c186a9f495aa4e3d058c612b2a9cf44a97ffbcecd75d441aed8263fac50 "$monocle" | sha256sum -c -
          artifact="$GITHUB_WORKSPACE/target/pocketgit-gui.jar"
          screenshot="$GITHUB_WORKSPACE/target/gui-smoke/history-viewer.png"
          export XDG_CACHE_HOME="$GITHUB_WORKSPACE/target/gui-smoke/cache"
          mkdir -p "$XDG_CACHE_HOME" "$GITHUB_WORKSPACE/target/gui-smoke/native"
          demo="$(mktemp -d)"
          cd "$demo"
          java -jar "$artifact" init
          java -jar "$artifact" config user.name 'PocketGit Demo'
          java -jar "$artifact" config user.email demo@example.com
          printf 'Initial content\n' > hello.txt
          python3 - <<'PY'
          from pathlib import Path
          directory = Path('many')
          directory.mkdir()
          for index in range(1000):
              (directory / f'{index:04d}.txt').write_text('shared content\n')
          PY
          java -jar "$artifact" add .
          java -jar "$artifact" commit -m 'Initial commit'
          java -jar "$artifact" branch experiment
          printf 'Second snapshot\n' >> hello.txt
          java -jar "$artifact" add .
          java -jar "$artifact" commit -m 'Update hello'
          find .pocketgit -type f -exec sha256sum {} + | LC_ALL=C sort > "$GITHUB_WORKSPACE/target/gui-smoke/before.sha256"
          timeout 60 java -Djavafx.cachedir="$GITHUB_WORKSPACE/target/gui-smoke/native" -Dglass.platform=Monocle -Dmonocle.platform=Headless -Dprism.order=sw -Dpocketgit.gui.smoke=true -Dpocketgit.gui.smoke.expectedFiles=1001 -Dpocketgit.gui.screenshot="$screenshot" -cp "$artifact:$monocle" com.pocketgit.PocketGit gui
          find .pocketgit -type f -exec sha256sum {} + | LC_ALL=C sort > "$GITHUB_WORKSPACE/target/gui-smoke/after.sha256"
          cmp "$GITHUB_WORKSPACE/target/gui-smoke/before.sha256" "$GITHUB_WORKSPACE/target/gui-smoke/after.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pocketgit-gui-linux
          path: |
            target/pocketgit-gui*.jar
            target/*.sha256
            target/gui-smoke/*.png
            target/gui-smoke/*.sha256
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/spotbugsXml.xml
            ${{ runner.temp }}/pocketgit-build.log
